packages:
  - apps/*
  - packages/*
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vitest: 4.1.11
# Phantom imports must fail: nothing is hoisted into a package's reach. Private
# hoisting stays on because expo/react-native type resolution relies on it.
publicHoistPattern: []
strictPeerDependencies: true
# `vite` is aliased to vite-plus-core (0.3.0), which no upstream peer range accepts.
peerDependencyRules:
  allowAny:
    - vite
allowBuilds:
  esbuild: true
  sharp: true
  lefthook: true
catalog:
  dotenv: ^17.4.2
  zod: ^4.4.3
  "@types/node": ^26.2.0
  hono: ^4.12.32
  "@hono/prometheus": ^1.0.3
  "prom-client": ^15.1.3
  evlog: ^2.28.0
  "@orpc/server": ^1.14.12
  "@orpc/openapi": ^1.14.12
  "@orpc/zod": ^1.14.12
  better-auth: 1.7.1
  "@hugeicons/react": ^1.1.10
  "@hugeicons/core-free-icons": ^4.3.3
  next-themes: ^0.4.6
  "@orpc/tanstack-query": ^1.14.12
  "@orpc/client": ^1.14.12
  "@tanstack/react-query": ^5.101.4
  "@tanstack/react-form": ^1.33.2
  "@types/react-dom": ^19.2.3
  tailwindcss: ^4.3.3
  tailwind-merge: ^3.6.0
  "@better-auth/expo": 1.7.1
  "drizzle-orm": 1.0.0-rc.4
  "drizzle-kit": 1.0.0-rc.4
  "@aws-sdk/client-s3": ^3.1125.0
  "@aws-sdk/s3-request-presigner": ^3.1125.0
  pg-boss: ^12.30.0
  ioredis: ^5.11.1
  typescript: ^6.0.3
  pg: ^8.22.0
  tsx: ^4.23.1
  tsdown: ^0.22.14
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.17
  vite-plus: 0.3.0
