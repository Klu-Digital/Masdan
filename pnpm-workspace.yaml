packages:
  - apps/*
  - packages/*
overrides:
  vite@*: "catalog:"
  vitest: 5.0.1
# Phantom imports must fail: nothing is hoisted into a package's reach.
publicHoistPattern: []
strictPeerDependencies: true
engineStrict: true
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    # Optional peer for its test helpers, which nothing here imports.
    better-auth>vitest: "5"
allowBuilds:
  esbuild: true
  sharp: true
  lefthook: true
catalog:
  dotenv: ^18.0.5
  zod: ^4.6.5
  "@types/node": ^26.6.4
  hono: ^4.13.12
  "@hono/prometheus": ^1.0.3
  "prom-client": ^15.1.3
  evlog: ^2.29.0
  "@orpc/server": ^1.15.4
  "@orpc/openapi": ^1.15.4
  "@orpc/zod": ^1.15.4
  better-auth: 1.7.1
  "@hugeicons/react": ^1.1.10
  "@hugeicons/core-free-icons": ^4.3.5
  next-themes: ^0.4.6
  "@orpc/tanstack-query": ^1.15.4
  "@orpc/client": ^1.15.4
  "@tanstack/react-query": ^5.104.1
  "@tanstack/react-form": ^1.33.5
  "@types/react-dom": ^19.3.0
  tailwindcss: ^4.3.3
  tailwind-merge: ^3.7.0
  "drizzle-orm": 1.0.0-rc.4
  "drizzle-kit": 1.0.0-rc.4
  "@aws-sdk/client-s3": ^3.1146.0
  "@aws-sdk/s3-request-presigner": ^3.1146.0
  pg-boss: ^12.36.0
  ioredis: ^6.0.0
  # TS 7 ships no compiler API yet: `tsc` runs on native, tools load the 6.x API.
  typescript: npm:@typescript/typescript6@^6.0.2
  "@typescript/native": npm:typescript@^7.0.2
  pg: ^8.23.1
  tsx: ^4.23.15
  tsdown: ^0.23.0
  react: ^19.3.0
  react-dom: ^19.3.0
  "@types/react": ^19.3.0
  vite-plus: 1.0.0
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
