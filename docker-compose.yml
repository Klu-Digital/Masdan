name: masdan

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    ports:
      - "${WEB_PORT:-2600}:80"
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      # Appended to the SPA's `connect-src` (see apps/web/nginx.conf.template).
      # Only MinIO: the API is same-origin now, reached through this container's
      # own /api/auth and /rpc proxy, so `'self'` covers it. Uploads go straight
      # from the page to a presigned URL and never touch the server, which is why
      # the bucket still has to be named here — leave it out and uploads break
      # while everything else keeps working, which is a confusing way to find out.
      CSP_CONNECT_SRC: http://localhost:${MINIO_PORT:-5300}
      # What nginx proxies the two API prefixes to, over the compose network.
      # Note the port is ${SERVER_PORT}, not a fixed 1900: the server binds
      # PORT to that same variable, so it moves the container-internal port too.
      SERVER_UPSTREAM: http://server:${SERVER_PORT:-1900}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    ports:
      - "${SERVER_PORT:-1900}:${SERVER_PORT:-1900}"
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      PORT: ${SERVER_PORT:-1900}
      BETTER_AUTH_URL: http://localhost:${SERVER_PORT:-1900}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-2600}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/masdan
      # Server -> bucket, over the compose network.
      S3_ENDPOINT: http://minio:9000
      # Host baked into presigned URLs; must be reachable from the browser, not from this container.
      S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-5300}
      S3_BUCKET: ${S3_BUCKET:-masdan}
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_FORCE_PATH_STYLE: "true"
      # Server -> Redis, over the compose network. Unlike MinIO there is no
      # public-endpoint twin here — nothing about Redis is ever handed to a
      # browser, so no client-reachable host needs to be baked into anything.
      REDIS_URL: redis://redis:6379
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:${SERVER_PORT:-1900}/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Consumes the job queue. No ports published: the HTTP server it runs exists
  # only for the healthcheck below and for Prometheus to scrape from inside the
  # compose network.
  workers:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    init: true
    env_file:
      - path: apps/workers/.env
        required: false
    environment:
      SERVICE_NAME: masdan-workers
      WORKERS_PORT: ${WORKERS_PORT:-1901}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/masdan
      # Import jobs read uploaded CSVs from the bucket over the compose network.
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-masdan}
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_FORCE_PATH_STYLE: "true"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:${WORKERS_PORT:-1901}/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: masdan-postgres
    environment:
      POSTGRES_DB: masdan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_PORT:-4400}:5432"
    volumes:
      - masdan_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: masdan-redis
    init: true
    # `--save 60 1` is one snapshot a minute if at least one key changed. Nothing
    # here is authoritative — sessions live in Postgres — so this exists only so a
    # `docker compose restart` does not reset everyone's rate-limit budget.
    command: ["redis-server", "--save", "60", "1"]
    ports:
      # 6666 on the host; the container-internal port stays 6379, so the
      # compose-network REDIS_URL on the server service is unaffected.
      - "${REDIS_PORT:-6666}:6379"
    volumes:
      - masdan_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    container_name: masdan-minio
    init: true
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Presigned PUTs go straight to the bucket, bypassing the server's own CORS
      # config, so MinIO is what has to allow the web origin. This build does not
      # implement the per-bucket PutBucketCors API — it is a server-level setting.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:${WEB_PORT:-2600}
    ports:
      - "${MINIO_PORT:-5300}:9000"
      - "${MINIO_CONSOLE_PORT:-5301}:9001"
    volumes:
      - masdan_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot: creates the bucket. CORS is configured on the minio service above.
  minio-init:
    image: quay.io/minio/mc:latest
    init: true
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-masdan}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        echo "minio ready: bucket $$S3_BUCKET"
    restart: "no"

volumes:
  masdan_postgres_data:
  masdan_minio_data:
  masdan_redis_data:
